<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Formulario reactivo
    </ion-title>
    <!-- Botón de modo oscuro: el icono cambia según el estado del Signal -->
    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkMode()" aria-label="Cambiar modo oscuro">
        <ion-icon slot="icon-only" [name]="isDarkMode() ? 'sunny' : 'moon'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Formulario</ion-title>
    </ion-toolbar>
  </ion-header>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">
      <!-- Campo Nombre -->
      <ion-item>
        <ion-input label="Nombre completo" labelPlacement="floating" type="text" formControlName="nombre"
          [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
        </ion-input>
      </ion-item>
      <!-- Campo Email con teclado específico para móviles -->
      <ion-item>
        <ion-input label="Correo Electrónico" labelPlacement="floating" type="email" inputmode="email"
          formControlName="email" [errorText]="'Introduzca un email válido.'">
        </ion-input>
      </ion-item>
      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password"  
          [errorText]="'Mínimo 8 caracteres, letras y números.'">
        </ion-input>
      </ion-item>
      <!-- El mínimo evita elegir fechas pasadas; el formulario también valida el dato. -->
      <ion-item>
        <ion-input label="Fecha" labelPlacement="floating" type="date" formControlName="fecha" [min]="today"
          [errorText]="'Seleccione hoy o una fecha futura.'">
        </ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding-top">
      <!-- Botón dinámico que responde al Signal -->
      <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
        @if (!isSubmitting()) {
          <span>Registrarse</span>
        } @else {
          <ion-spinner name="crescent"></ion-spinner>
        }
      </ion-button>
      <!-- Descarga del PDF: @if renderiza el botón solo cuando lastSubmission() tiene datos.
           type="button" evita que dispare el envío del formulario. -->
      @if (lastSubmission()) {
        <ion-button expand="block" fill="outline" class="ion-margin-top" type="button" (click)="downloadPdf()">
          Descargar PDF
        </ion-button>
      }
    </div>
  </form>

</ion-content>
