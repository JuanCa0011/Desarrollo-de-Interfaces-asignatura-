<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Catálogo de libros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catálogo de libros</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (loading()) {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="dots" aria-label="Cargando catálogo"></ion-spinner>
    </div>
  } @else if (errorMessage()) {
    <ion-text color="danger" role="alert">
      <p>{{ errorMessage() }}</p>
    </ion-text>
  } @else {
    <app-book-data-table
      [libros]="libros()"
      caption="Catálogo de libros"
      (rowSelected)="onRowSelected($event)"
    />
    @if (selected(); as libro) {
      <p class="ion-padding-top" aria-live="polite">
        Seleccionado: <strong>{{ libro.titulo }}</strong> — {{ libro.autor }}
      </p>
    }
  }
</ion-content>
