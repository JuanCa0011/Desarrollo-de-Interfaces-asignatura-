<ion-split-pane contentId="main-content">
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Librería DI 0488</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/"
            routerLinkActive="selected"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <ion-icon slot="start" name="library-outline" aria-hidden="true"></ion-icon>
            <ion-label>Catálogo</ion-label>
          </ion-item>
        </ion-menu-toggle>

        @if (authService.isAdmin()) {
          <ion-menu-toggle autoHide="false">
            <ion-item routerLink="/admin" routerLinkActive="selected">
              <ion-icon slot="start" name="grid-outline" aria-hidden="true"></ion-icon>
              <ion-label>Panel de administración</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }

        <ion-menu-toggle autoHide="false">
          <ion-item button="true" (click)="logout()">
            <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-split-pane>
