<button
  type="button"
  class="stat-widget"
  [class]="'stat-widget stat-widget--' + color()"
  (click)="selected.emit()"
>
  @if (icon(); as iconName) {
    <span class="stat-widget__icon" aria-hidden="true">
      <ion-icon [name]="iconName"></ion-icon>
    </span>
  }
  <span class="stat-widget__body">
    <span class="stat-widget__label">{{ label() }}</span>
    <span class="stat-widget__value">{{ value() }}</span>
    @if (hint()) {
      <span class="stat-widget__hint">{{ hint() }}</span>
    }
  </span>
</button>
